<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> About Me - Bimal Reddy </title>
        <style>
            :root {
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --text-primary: #f8fafc;
                --text-secondary: #94a3b8;
                --accent-glow: #6366f1;
                --border-color: #334155;
                --button-bg: #0f172a;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body{
                font-family: system-ui, sans-serif;
                background-color: var(--bg-color);
                color: var(--text-primary);
                min-height: 100vh;
                padding: 20px;
                align-items: center;
                display: flex;
                justify-content: center;
            }

            .card {
                background-color: var(--card-bg);
                border: 1px solid var(--border-color);
                border-radius: 20px;
                width: 100%;
                max-width:400px;
                padding: 36px 28px;
                box-shadow: 1 20px 30px rgba(0, 0, 0, 0.4);
                text-align: center;
            }
            
            .avatar{
                width:88px;
                height:88px;
                display: flex;
                border-radius: 50%;
                background: linear-gradient(135deg, #6366f1, #a855f7);
                align-items: center;
                justify-content: center;
                font-size: 2rem;
                font-weight: 700;
                color: #ffffff;
                margin: 0 auto 20px;
                box-shadow: 0 0 24px rgba(99, 102, 241, 0.4);
            }

            h1{
                font-size:1.5rem;
                margin-bottom: 6px;
                font-weight: 700;
            }

            .bio{
                color: var(--text-secondary);
                font-size: 0.95rem;
                line-height: 1.4;
                margin-bottom: 28px;
            }

            .tags{
                justify-content: center;
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                margin-bottom: 18px;
            }

            .tag {
                background-color: rgba(99, 102, 241, 0.15);
                color: #818cf8;
                font-size: 0.75rem;
                font-weight: 600;
                padding: 4px 12px;
                border-radius: 999px;
                border: 1px solid rgba(99, 102, 241, 0.15)
            }

            .section-title{
                font-size: 0.8rem;
                text-transform: uppercase;
                letter-spacing: 1px;
                color: var(--text-secondary);
                margin-bottom: 12px;
                text-align: left;
                font-weight:600;
            }

            .link-button{
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 14px 18px;
                background-color: var(--button-bg);
                border: 1px solid var(--border-color);
                color: var(--text-primary);
                text-decoration: none;
                border-radius: 12px;
                font-size: 0.95rem;
                font-weight: 500;
                transition: all 0.2s ease;
            }
            
            .link-button:hover{
                border-color: var(--accent-glow);
                background-color: rgba(99, 102, 241, 0.15);
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2)
            }

            .link-button svg{
                width: 20px;
                height: 20px;
                fill: currentColor;
                flex-shrink: 0;
            }

            .link-button span{
                flex-grow: 1;
                text-align;
            }

            .arrow{
                color: var(--text-secondary);
                transition: transform 0.2 ease;
            }

            .link-button:hover .arrow{
                transform: translateX(3px);
                color: var(--accent-glow);
            }

            .social-links {
                display: flex;
                flex-direction:column;
                gap: 12px;
            }

        </style>
    </head>
<body>
    <div class="card">
        <div class="avatar">BR</div>
    </div>

    <h1>My name is Bimal Reddy</h1>
    <p class="bio"> computer enthusiast</p>

    <div vlass="tags">
        <span class="tag">HTML</span>    
        <span class="tag">CSS</span>
        <span class="tag">Python</span>
    </div>

    <p class="section-title">
        Connect with me
    </p>

    <div class="social-links">
        <a href="mailto:cbimalreddy@gmail.com" class="link-button">
            <span> Email Me</span>
            <span class="arrow">&rarr;</span>
        </a>

        <a href="https://instagram.com/bimal_reddy" target="_blank" rel="noopener" class="link-button">
            <span>Instagram</span>
            <span class="arrow">&rarr;</span>
        </a>

        <a href="https://github.com/BimalReddy" target="_blank" rel="noopener" class="link-button">
            <span>GitHub</span>
            <span class="arrow">&rarr;</span>
        </a>
    </div>

</body>
</html>
